version: '3.8'

services:
  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn portfolio_site.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - ALLOWED_HOSTS=*
    restart: unless-stopped
