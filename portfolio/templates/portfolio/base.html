<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Carson Honkala{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="main-nav">
        <div class="container">
            <a href="{% url 'portfolio:home' %}" class="logo">Carson Honkala</a>
            <ul class="nav-links">
                <li><a href="{% url 'portfolio:home' %}">Home</a></li>
                <li><a href="{% url 'portfolio:blog_list' %}">Blog</a></li>
                <li><a href="{% url 'portfolio:project_list' %}">Projects</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
